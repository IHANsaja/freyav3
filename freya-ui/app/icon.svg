<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Freyja">
  <!--
    Freyja's mark: ᚠ Fehu — first rune of Freyr's ætt, her family's — cut in
    even, straight strokes like a carved rune, in the dashboard's jade. The gold
    dot is Brísingamen's jewel, set like a signature's full stop.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1a16"/>
      <stop offset="1" stop-color="#070b0a"/>
    </linearGradient>
    <linearGradient id="jade" gradientUnits="userSpaceOnUse" x1="22" y1="50" x2="44" y2="14">
      <stop offset="0" stop-color="#14b884"/>
      <stop offset="1" stop-color="#5ff2c0"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#tile)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.25" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1.5"/>

  <path d="M23 50 V14 M23 28 L39 16 M23 40 L42 25.75"
        fill="none" stroke="url(#jade)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="42" cy="47" r="3.4" fill="#f2b45a"/>
</svg>
